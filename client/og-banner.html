<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShipFolio OG Banner — Screenshot this at 1200×630</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .banner {
      width: 1200px;
      height: 630px;
      background: #080A08;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 100px;
    }
    /* Background glows */
    .glow-1 {
      position: absolute;
      top: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: rgba(182, 243, 74, 0.04);
      filter: blur(120px);
    }
    .glow-2 {
      position: absolute;
      bottom: -30%;
      left: -5%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(182, 243, 74, 0.03);
      filter: blur(100px);
    }
    /* Grid pattern */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(182, 243, 74, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(182, 243, 74, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    }
    /* Content */
    .content { position: relative; z-index: 10; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid rgba(182, 243, 74, 0.2);
      background: rgba(182, 243, 74, 0.05);
      color: #B6F34A;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #B6F34A;
    }
    h1 {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.95;
      color: #F5F7F2;
      margin-bottom: 24px;
    }
    h1 .green { color: #B6F34A; }
    .tagline {
      font-size: 22px;
      color: #8A8F89;
      line-height: 1.5;
      max-width: 600px;
      margin-bottom: 40px;
    }
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 100px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo svg { width: 32px; height: 32px; }
    .logo-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #F5F7F2;
    }
    .url {
      font-size: 14px;
      color: #555B55;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    /* Ship icon */
    .icon {
      position: absolute;
      top: 80px;
      right: 100px;
      width: 160px;
      height: 160px;
      opacity: 0.08;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="grid"></div>

    <!-- Ghost icon -->
    <svg class="icon" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" stroke="#B6F34A" stroke-width="1.5" fill="none"/>
      <path d="M16 33L24 13L32 33" stroke="#B6F34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="18" y1="28" x2="30" y2="28" stroke="#B6F34A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="24" cy="13" r="2.5" fill="#B6F34A"/>
    </svg>

    <div class="content">
      <div class="badge">
        <span class="dot"></span>
        Ship. Showcase. Track.
      </div>
      <h1>Ship<span class="green">Folio</span></h1>
      <p class="tagline">
        A living portfolio for things you actually build.<br />
        For indie hackers, developers, and creators who ship.
      </p>
    </div>

    <div class="bottom-bar">
      <div class="logo">
        <svg viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="22" stroke="#B6F34A" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
          <path d="M16 33L24 13L32 33" stroke="#B6F34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <line x1="18" y1="28" x2="30" y2="28" stroke="#B6F34A" stroke-width="2" stroke-linecap="round"/>
          <circle cx="24" cy="13" r="2.5" fill="#B6F34A"/>
        </svg>
        <span class="logo-text">ShipFolio</span>
      </div>
      <span class="url">shipfolio.com</span>
    </div>
  </div>
</body>
</html>
