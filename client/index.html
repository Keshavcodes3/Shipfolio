<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>ShipFolio — A living portfolio for things you actually build</title>
    <meta name="description" content="Ship, showcase, and track what you build. ShipFolio is a living portfolio for indie hackers, developers, and creators who ship real projects." />
    <meta name="keywords" content="portfolio, build in public, indie hackers, ship, showcase, projects, developer portfolio, side projects, launch, portfolio for builders" />
    <meta name="author" content="ShipFolio" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://shipfolio.com/" />

    <!-- Theme -->
    <meta name="theme-color" content="#080A08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShipFolio" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shipfolio.com/" />
    <meta property="og:title" content="ShipFolio — A living portfolio for things you actually build" />
    <meta property="og:description" content="Ship, showcase, and track what you build. A living portfolio for indie hackers, developers, and creators who ship real projects." />
    <meta property="og:image" content="https://shipfolio.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ShipFolio — Ship. Showcase. Track." />
    <meta property="og:site_name" content="ShipFolio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://shipfolio.com/" />
    <meta name="twitter:title" content="ShipFolio — A living portfolio for things you actually build" />
    <meta name="twitter:description" content="Ship, showcase, and track what you build. A living portfolio for indie hackers, developers, and creators who ship real projects." />
    <meta name="twitter:image" content="https://shipfolio.com/og-image.png" />
    <meta name="twitter:image:alt" content="ShipFolio — Ship. Showcase. Track." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ShipFolio",
      "url": "https://shipfolio.com",
      "description": "A living portfolio for things you actually build.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://shipfolio.com/discover?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
